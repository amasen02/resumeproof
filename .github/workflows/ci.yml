name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: resumeproof demo --output-dir demo-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-receipt-py${{ matrix.python-version }}
          path: |
            demo-output/receipt.json
            demo-output/timeline.txt
